context:
  name: "YggInterface"
  python_name: "ygginterface"
  version: "0.1.0"
  version_major: "0"
  build_number: 0

recipe:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # url: https://github.com/langmm/yggcpp/archive/refs/tags/v${{ version }}.tar.gz
  # sha256: 
  path: ../

build:
  number: ${{ build_number }}
  string: v${{ version | version_to_buildstring }}${{ toolchain_variant }}_py${{ python | version_to_buildstring }}_h${{ hash }}_${{ build_number }}
  variant:
    down_prioritize_variant: ${{ 1 if toolchain_variant == "m2w64" else 0 }}

outputs:
  - package:
      name: ygginterface-libs
    build:
      script:
        - if: unix
          then:
            - build.sh
        - if: win
          then:
            - build.bat
    requirements:
      run_exports:
        - ${{ pin_subpackage('ygginterface-libs', exact=True) }}
      build:
        - if: build_platform != host_platform
          then:
            - cross-python_${{ host_platform }}
        - python
        - numpy >=1.13.0
        - cmake >=3.16
        - libcurl
        - if: win
          then:
            - binutils <2.43
            - make
            - ${{ stdlib('m2w64_c') }}
            - ${{ compiler('m2w64_c') }}
            - ${{ compiler('m2w64_cxx') }}
            - ${{ compiler('m2w64_fortran') }}
        - ninja
        - pkgconfig
        - if: toolchain_variant != "m2w64"
          then:
            - ${{ stdlib('c') }}
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ compiler('fortran') }}
        - libcurl
        - llvm-openmp
        - openmpi
        - if: unix
          then: sysv_ipc
        - yggdrasil-rapidjson
        - zeromq
      host:
        - llvm-openmp
        - if: win
          then: make
        - ninja
        - numpy >=1.13.0
        - openmpi
        - pip
        - python
        - if: unix
          then: sysv_ipc
        - yggdrasil-rapidjson
        - zeromq
      run:
        - python
        - yggdrasil-rapidjson
    tests:
      - package_contents:
          files:
            - if: win
              then:
                # Mingw install dosn't put things where rattler-build expects
                - if: toolchain_variant == "m2w64"
                  then:
                    - Lib/cmake/YggInterface/YggInterfaceConfig.cmake
                    - Lib/cmake/YggInterface/YggInterfaceConfigVersion.cmake
                    - Lib/libYggInterface.dll.a
                    - bin/libYggInterface-${{ version_major }}.dll
                    - Lib/libYggInterface_fortran.dll.a
                    - bin/libYggInterface_fortran-${{ version_major }}.dll
                    - include/YggInterface/YggInterface.hpp
                    - include/YggInterface/YggInterface.h
                    - include/YggInterface/ygginterface.mod
                - if: toolchain_variant != "m2w64"
                  then:
                    - cmake/YggInterface/YggInterfaceConfig.cmake
                    - cmake/YggInterface/YggInterfaceConfigVersion.cmake
                    - lib/pkgconfig/YggInterface.pc
                    - lib/YggInterface.lib
                    - bin/YggInterface-${{ version_major }}.dll
                    - lib/YggInterface_fortran.lib
                    - bin/YggInterface_fortran-${{ version_major }}.dll
            - if: unix
              then:
                - lib/cmake/YggInterface/YggInterfaceConfig.cmake
                - lib/cmake/YggInterface/YggInterfaceConfigVersion.cmake
                - lib/pkgconfig/YggInterface.pc
          lib:
            - if: toolchain_variant != "m2w64"
              then:
                - YggInterface
                - YggInterface_fortran
          include:
            - if: toolchain_variant != "m2w64"
              then:
                - YggInterface/YggInterface.hpp
                - YggInterface/YggInterface.h
                - YggInterface/ygginterface.mod
      - script:
          - if: unix
            then:
              - tests/run_test.sh
          - if: win
            then:
              - tests/run_test.bat
        requirements:
          run:
            - flask
            - ninja
            - cmake
            - if: win  # toolchain_variant == "m2w64"
              then:
                - binutils <2.43
                - make
                - ${{ stdlib('m2w64_c') }}
                - ${{ compiler('m2w64_c') }}
                - ${{ compiler('m2w64_cxx') }}
            - if: toolchain_variant != "m2w64"
              then:
                - ${{ stdlib('c') }}
                - ${{ compiler('c') }}
                - ${{ compiler('cxx') }}
            - if: win
              then:
                - ${{ compiler('m2w64_fortran') }}
            - if: unix
              then:
                - ${{ compiler('fortran') }}
        files:
          source:
            - tests/
        
  - package:
      name: ygginterface-python
    build:
      string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}
      # string: v${{ version | version_to_buildstring }}_py${{ python | version_to_buildstring }}_h${{ hash }}_${{ build_number }}
      variant:
        ignore_keys:
          - toolchain_variant
      script:
        - if: unix
          then:
            - build_python.sh
        - if: win
          then:
            - build_python.bat
    requirements:
      build:
        - if: build_platform != host_platform
          then:
            - cross-python_${{ host_platform }}
        - python
        - numpy >=1.13.0
        - cmake >=3.16
        - libcurl
        - ninja
        - pkgconfig
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - libcurl
        - llvm-openmp
        - openmpi
        - if: unix
          then: sysv_ipc
        - yggdrasil-rapidjson
        - zeromq
      host:
        - hatch-fancy-pypi-readme
        - llvm-openmp
        - if: win
          then: make
        - ninja
        - numpy >=1.13.0
        - openmpi
        - pip
        - python
        - scikit-build-core
        - setuptools_scm
        - if: unix
          then: sysv_ipc
        - yggdrasil-rapidjson
        - zeromq
      run:
        - python
    tests:
      - python:
          imports:
            - YggInterface
      - script:
          - pytest -sv tests/python
        requirements:
          run:
            - pytest
            - flask
        files:
          source:
            - tests/

  - package:
      name: ygginterface
    build:
      script:
    requirements:
      run:
        - ${{ pin_subpackage('ygginterface-libs', exact=True) }}
        - ${{ pin_subpackage('ygginterface-python', exact=True) }}

about:
  homepage: https://github.com/langmm/yggcpp
  repository: https://github.com/langmm/yggcpp
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A framework for connecting computational models from multiple languages.
  description: |
    The Crops in Silico (CiS) framework, yggdrasil, provides support for
    connecting scientific models written in different programming languages.
    To connect two models, modelers add communications interfaces to the model code
    and provide declarative specification files that identfy the
    models that should be run and the inputs and outputs those models
    expect. yggdrasil uses this information to launch the models
    on parallel processes and orchestrate asynchronous communication between them.
    Although designed for connecting crop models, yggdrasil can be used to
    connect scientific models from any domain.
  documentation: https://cropsinsilico.github.io/yggcpp

extra:
  recipe-maintainers:
    - langmm
