context:
  name: "YggInterface"
  python_name: "ygginterface"
  version: "0.1.0"
  version_major: "0"
  build_number: 0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  # url: https://pypi.io/packages/source/${{ name[0] }}/${{ name }}/${{ python_name }}-${{ version }}.tar.gz
  # sha256: 
  path: ../

build:
  number: ${{ build_number }}
  string: py${{ python | version_to_buildstring }}h${{ hash }}_${{ build_number }}

requirements:
  run_exports:
    - ${{ pin_subpackage('ygginterface', exact=True) }}
  build:
    - if: build_platform != host_platform
      then:
        - cross-python_${{ host_platform }}
    - python
    - numpy >=1.13.0
    - cmake >=3.16
    - libcurl
    - if: win
      then:
        - binutils <2.43
        - make
        - ${{ stdlib('m2w64_c') }}
        - ${{ compiler('m2w64_c') }}
        - ${{ compiler('m2w64_cxx') }}
        - ${{ compiler('m2w64_fortran') }}
    - ninja
    - pkgconfig
    - if: unix
      then:
        - ${{ stdlib('c') }}
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - ${{ compiler('fortran') }}
    - libcurl
    - llvm-openmp
    - openmpi
    - if: unix
      then: sysv_ipc
    - yggdrasil-rapidjson
    - zeromq
  host:
    - hatch-fancy-pypi-readme
    - llvm-openmp
    - if: win
      then: make
    - ninja
    - numpy >=1.13.0
    - openmpi
    - pip
    - python
    - scikit-build-core
    - setuptools_scm
    - if: unix
      then: sysv_ipc
    - yggdrasil-rapidjson
    - zeromq
  run:
    # - if: unix
    #   then:
    #     - ${{ stdlib('c') }}
    - python
    - yggdrasil-rapidjson

tests:
  - package_contents:
      files:
        - if: win
          then:
            - Lib/cmake/YggInterface/YggInterfaceConfig.cmake
            - Lib/cmake/YggInterface/YggInterfaceConfigVersion.cmake
            - Lib/libYggInterface.dll.a
            - Lib/libYggInterface_fortran.dll.a
            - bin/libYggInterface-${{ version_major }}.dll
            - bin/libYggInterface_fortran-${{ version_major }}.dll
            - include/YggInterface/YggInterface.hpp
            - include/YggInterface/YggInterface.h
            - include/YggInterface/ygginterface.mod
        - if: unix
          then:
            - lib/cmake/YggInterface/YggInterfaceConfig.cmake
            - lib/cmake/YggInterface/YggInterfaceConfigVersion.cmake
        - if: linux
          then:
            - lib/libYggInterface.so.${{ version_major }}
            - lib/libYggInterface_fortran.so.${{ version_major }}
        - if: osx
          then:
            - lib/libYggInterface.${{ version_major }}.dylib
            - lib/libYggInterface_fortran.${{ version_major }}.dylib
      lib:
        - YggInterface
        - YggInterface_fortran
      include:
        # - if: win
        #   then:
        #     - YggInterface/YggInterface.hpp
        #     - YggInterface/YggInterface.h
        #     - YggInterface/ygginterface.mod
        - if: unix
          then:
            - YggInterface/YggInterface.hpp
            - YggInterface/YggInterface.h
            - YggInterface/ygginterface.mod
  - python:
      imports:
        - YggInterface
  - script:
      - pytest -sv tests/python
    requirements:
      run:
        - pytest
        - flask
    files:
      source:
        - tests/
  - script:
      - if: unix
        then:
          - tests/run_test.sh
      - if: win
        then:
          - tests/run_test.bat
    requirements:
      run:
        - flask
        - ninja
        - cmake
        - if: unix
          then:
            - ${{ stdlib('c') }}
            - ${{ compiler('c') }}
            - ${{ compiler('cxx') }}
            - ${{ compiler('fortran') }}
        - if: win
          then:
            - binutils <2.43
            - make
            - ${{ stdlib('m2w64_c') }}
            - ${{ compiler('m2w64_c') }}
            - ${{ compiler('m2w64_cxx') }}
            - ${{ compiler('m2w64_fortran') }}
    files:
      source:
        - tests/

about:
  homepage: https://github.com/langmm/yggcpp
  repository: https://github.com/langmm/yggcpp
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: A framework for connecting computational models from multiple languages.
  description: |
    The Crops in Silico (CiS) framework, yggdrasil, provides support for
    connecting scientific models written in different programming languages.
    To connect two models, modelers add communications interfaces to the model code
    and provide declarative specification files that identfy the
    models that should be run and the inputs and outputs those models
    expect. yggdrasil uses this information to launch the models
    on parallel processes and orchestrate asynchronous communication between them.
    Although designed for connecting crop models, yggdrasil can be used to
    connect scientific models from any domain.
  documentation: https://cropsinsilico.github.io/yggcpp

extra:
  recipe-maintainers:
    - langmm
