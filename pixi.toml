[workspace]
name = "yggcpp"
version = "0.1.0"
description = "A framework for connecting computational models from multiple languages."
authors = ["Meagan Lang <langmm.astro@gmail.com>"]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "linux-aarch64", "win-64"]
preview = ["pixi-build"]
build-variants-files = [
  "./conda.recipe/conda_build_config.yaml",
]

[dependencies]
python = ">=3.11"
numpy = ">=1.23"
cmake = ">=3.18"
ninja = ">=1.11"
pkg-config = "*"
yggdrasil-rapidjson = ">=1.1.0.5"
jinja2 = "*"
pyyaml = "*"

[feature.optional.dependencies]
libcurl = "*"
zeromq = "*"
openmpi = "*"
flask = "*"
# librabbitmq = "*"

[feature.optional.target.unix.dependencies]
sysv_ipc = "*"

[feature.optional.target.osx.dependencies]
llvm-openmp = "*"

[activation.env]
CMAKE_GENERATOR = "Ninja"
CMAKE_PREFIX_PATH = "$CONDA_PREFIX"
CMAKE_INSTALL_PREFIX = "$CONDA_PREFIX"

# Set these by default?
# -DYGG_DEBUG_LEVEL=5
# -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON
# -DCMAKE_MESSAGE_LOG_LEVEL:STRING=DEBUG

[tasks]
clean = "python -c \"import glob, shutil; [shutil.rmtree(p, ignore_errors=True) for p in glob.glob('build*') + ['_install', '_skbuild', 'conda_build']]\""
configure = {
  cmd = "cmake -S . -B build/all -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=ON -DBUILD_Python_LIBRARY=ON -DYGG_BUILD_TESTS=ON -DYGG_Fortran_REQUIRED=ON -DYGG_SKIP_VALGRIND_TESTS=ON -DENABLE_RMQ=OFF {{ extra_flags }}",
  args = [
    { arg = "extra_flags", default = "" },
  ],
}
build = {
  cmd = "cmake --build build/all --parallel",
  args = [
    { arg = "extra_flags", default = "" },
  ],
  depends-on = [
    {
      task = "configure",
      args = ["{{ extra_flags }}"],
    }
  ]
}
test = {
  cmd = "ctest --test-dir build/all --output-on-failure",
  args = [
    { arg = "extra_flags", default = "" },
  ],
  depends-on = [
    {
      task = "build",
      args = ["{{ extra_flags }}"],
    }
  ],
  
}
install = {
  cmd = "cmake --install build/all",
  depends-on = [
    {
      task = "build",
    }
  ]
}
configure-speed = {
  cmd = "cmake -S tests/speedtest -B build/speed -G Ninja -DCOMM=ALL",
  # -DENABLE_Fortran=OFF
  depends-on = [
    {
      task = "install",
      args = ["--prefix", "$CONDA_PREFIX"],
    },
  ],
}
build-speed = {
  cmd = "cmake --build build/speed --config Release",
  depends-on = ["configure-speed"],
}
test-speed = {
  cmd = "ctest --test-dir build/speed --output-on-failure -VV -C Release",
  depends-on = ["build-speed"],
}
all-tests = {
  description = "Run tests for all supported interfaces",
  depends-on = ["test", "test-python", "test-speed"],
}

[feature.py311.dependencies]
python = "3.11.*"

[feature.py312.dependencies]
python = "3.12.*"

[feature.py313.dependencies]
python = "3.13.*"

[feature.py314.dependencies]
python = "3.14.*"

[feature.py315.dependencies]
python = "3.15.*"
libpython = "3.15.*"

[feature.cxx.dependencies]
c-compiler = "*"
cxx-compiler = "*"

[feature.cxx.tasks]
configure-cxx = "cmake -S . -B build/cxx -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=OFF -DBUILD_Python_LIBRARY=OFF -DYGG_BUILD_TESTS=OFF -DYGG_BUILD_CXX_TESTS=ON -DYGG_SKIP_VALGRIND_TESTS=ON -DENABLE_RMQ=OFF"
build-cxx = { cmd = "cmake --build build/cxx --parallel", depends-on = ["configure-cxx"] }
test-cxx = { cmd = "ctest --test-dir build/cxx --output-on-failure", depends-on = ["build-cxx"] }
install-cxx = { cmd = "cmake --install build/cxx", depends-on = ["build-cxx"] }

[feature.fortran.dependencies]
fortran-compiler = "*"

[feature.fortran.target.win.dependencies]
gcc = "*"
gxx = "*"
gfortran = "*"
binutils = "<2.45"
libpython = "*"

[feature.fortran.tasks]
configure-fortran = "cmake -S . -B build/fortran -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=ON -DBUILD_Python_LIBRARY=OFF -DYGG_BUILD_TESTS=OFF -DYGG_BUILD_CXX_TESTS=OFF -DYGG_BUILD_Fortran_TESTS=ON -DYGG_Fortran_REQUIRED=ON -DYGG_SKIP_VALGRIND_TESTS=ON -DENABLE_RMQ=OFF"
build-fortran = { cmd = "cmake --build build/fortran --parallel", depends-on = ["configure-fortran"] }
test-fortran = { cmd = "ctest --test-dir build/fortran --output-on-failure", depends-on = ["build-fortran"] }
install-fortran = { cmd = "cmake --install build/fortran", depends-on = ["build-fortran"] }

[feature.python.activation.env]
SKBUILD_CMAKE_DEFINE = "ENABLE_RMQ=OFF"

[feature.python.dependencies]
pip = "*"
scikit-build-core = "*"
setuptools_scm = "*"
hatch-fancy-pypi-readme = "*"
pytest = "*"
python-build = "*"

[feature.python.tasks]
install-python = "python -m pip install --no-build-isolation --no-deps -v ."
develop-python = "python -m pip install --no-build-isolation --no-deps -v -e ."
test-python = { cmd = "python -m pytest -sv tests/python", depends-on = ["install-python"] }

[feature.coverage.dependencies]
lcov = "*"
gcovr = "*"

[feature.coverage.tasks]
configure-coverage = {
  cmd = "cmake -S . -B build/coverage -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=ON -DBUILD_Python_LIBRARY=OFF -DYGG_BUILD_TESTS=ON -DYGG_BUILD_Python_TESTS=OFF -DYGG_Fortran_REQUIRED=ON -DYGG_SKIP_VALGRIND_TESTS=ON -DYGG_ENABLE_COVERAGE=ON -DENABLE_RMQ=OFF",
}
build-coverage = {
  cmd = "cmake --build build/coverage --parallel",
  depends-on = ["configure-coverage"],
}
test-coverage = {
  cmd = "ctest --test-dir build/coverage --output-on-failure",
  depends-on = ["build-coverage"],
}

[feature.valgrind.target.linux.dependencies]
valgrind = "*"

[feature.valgrind.tasks]
configure-valgrind = {
  cmd = "cmake -S . -B build/valgrind -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=ON -DBUILD_Python_LIBRARY=OFF -DYGG_BUILD_TESTS=ON -DYGG_BUILD_Python_TESTS=OFF -DYGG_Fortran_REQUIRED=ON -DYGG_SKIP_VALGRIND_TESTS=OFF -DYGG_ENABLE_INSTRUMENTATION_OPT=OFF -DYGGDRASIL_DISABLE_Python_C_API=ON -DENABLE_OMP=OFF -DYGG_EMBED_Python=OFF",
}
build-valgrind = {
  cmd = "cmake --build build/valgrind --parallel",
  depends-on = ["configure-valgrind"],
}
test-valgrind = {
  cmd = "ctest --test-dir build/valgrind --output-on-failure",
  depends-on = ["build-valgrind"],
}

[feature.asan.activation.env]
ASAN_OPTIONS = "detect_odr_violation=0:detect_container_overflow=0"

[feature.asan.target.osx.activation.env]
DYLD_INSERT_LIBRARIES = "$(clang -print-file-name=libclang_rt.asan_osx_dynamic.dylib)"

[feature.asan.tasks]
configure-asan = {
  cmd = "cmake -S . -B build/asan -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=ON -DBUILD_Python_LIBRARY=ON -DYGG_BUILD_TESTS=ON -DYGG_Fortran_REQUIRED=ON -DYGG_SKIP_VALGRIND_TESTS=ON -DYGG_BUILD_ASAN=ON -DYGG_BUILD_UBSAN=ON -DENABLE_RMQ=OFF",
  # -DYGGDRASIL_DISABLE_Python_C_API=ON
}
build-asan = {
  cmd = "cmake --build build/asan --parallel",
  depends-on = ["configure-asan"],
}
test-asan = {
  cmd = "ctest --test-dir build/asan --output-on-failure -E valgrind*",
  depends-on = ["build-asan"],
}
  
[feature.elf.tasks]
configure-elf = {
  cmd = "cmake -S . -B build/elf -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_CXX_LIBRARY=ON -DBUILD_Fortran_LIBRARY=ON -DBUILD_Python_LIBRARY=OFF -DYGG_BUILD_TESTS=ON -DYGG_Fortran_REQUIRED=ON -DYGG_BUILD_Python_TESTS=OFF -DYGG_SKIP_VALGRIND_TESTS=ON -DYGG_ENABLE_ELF=ON -DENABLE_RMQ=OFF",
}
build-elf = {
  cmd = "cmake --build build/elf --parallel",
  depends-on = ["configure-elf"],
}
test-elf = {
  cmd = "ctest --test-dir build/elf --output-on-failure",
  depends-on = ["build-elf"],
}
  
[feature.docs.dependencies]
doxygen = ">=1.9.2"
graphviz = "*"

[feature.docs.tasks]
docs = "cmake -S . -B build/docs -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DYGG_BUILD_DOCS=ON -DBUILD_CXX_LIBRARY=OFF -DBUILD_Fortran_LIBRARY=OFF -DBUILD_Python_LIBRARY=OFF -DDOXYGEN_CHECK_MISSING=OFF && cmake --build build/docs --target docs"

[feature.dev.dependencies]
ccache = "*"
git = "*"
git-cliff = "*"

[feature.dev.tasks]
setup-hooks = {
  description = "Enable the tracked git hooks in githooks/",
  cmd = "git config core.hooksPath githooks",
}
changelog = {
  cmd = "git-cliff 9d764bfa1605147affd8deeb9afb7a1051a542c3..HEAD --prepend",
  # Use this version after first release
  # cmd = "git-cliff --unreleased --bump --prepend",
  description = "Update the change log",
}

[feature.build-conda.dependencies]
rattler-build = "*"

[feature.build-conda.tasks.build-conda]
description = "Build conda package with pixi publish"
args = [
    { arg = "recipe", default = "conda.recipe/recipe.yaml" },
    { arg = "output_dir", default = "build_conda" },
]
cmd = "pixi publish --path {{ recipe }} --target-dir {{ output_dir }}"

[environments]
default = { features = ["cxx", "fortran", "python", "docs", "dev", "optional"], solve-group = "default" }
core = { features = ["cxx", "fortran", "python"], solve-group = "default" }
coverage = { features = ["cxx", "fortran", "python", "optional", "coverage"], solve-group = "coverage" }
valgrind = { features = ["cxx", "fortran", "python", "optional", "valgrind"], solve-group = "valgrind" }
asan = { features = ["cxx", "fortran", "python", "optional", "asan"], solve-group = "asan" }
elf = { features = ["cxx", "fortran", "python", "optional", "elf"], solve-group = "elf" }
cxx = { features = ["cxx", "optional"], solve-group = "cxx" }
fortran = { features = ["cxx", "fortran", "optional"], solve-group = "fortran" }
python = { features = ["cxx", "python", "optional"], solve-group = "python" }
docs = { features = ["cxx", "docs"], solve-group = "docs" }
build-conda = { features = ["build-conda"] }
test-py315-core = { features = ["py315", "cxx", "fortran", "python"] }
test-py311 = { features = ["py311", "cxx", "fortran", "python", "optional"] }
test-py312 = { features = ["py312", "cxx", "fortran", "python", "optional"] }
test-py313 = { features = ["py313", "cxx", "fortran", "python", "optional"] }
test-py314 = { features = ["py314", "cxx", "fortran", "python", "optional"] }
test-py315 = { features = ["py315", "cxx", "fortran", "python", "optional"] }
