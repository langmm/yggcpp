name: Test of package installation & execution
'on':
  push:
    branches-ignore:
     - gh-pages
    tags:
     - '*'
  schedule:
  - cron: 0 10 * * 1
  workflow_dispatch:

env:
  PYTHONVERSION: "3.11"
jobs:
  build_cxx:
    runs-on: ${{ matrix.os }}
    # services:
    #   rabbitmq:
    #     image: rabbitmq:latest
    #     ports:
    #       - 5672:5672
    #     options: --health-cmd "rabbitmqctl node_health_check" --health-interval 10s --health-timeout 5s --health-retries 5
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022]
        python-install: [pip, conda]
        windows-compiler: [mingw]
        include:
          - os: windows-2022
            python-install: pip
            windows-compiler: msvc
          - os: windows-2022
            python-install: conda
            windows-compiler: msvc
      fail-fast: false
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          submodules: true

      ###################################
      # PIP SETUP
      ###################################
      - name: Install dependencies on Ubuntu
        if: matrix.os == 'ubuntu-latest' && matrix.python-install == 'pip'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg gdb valgrind lcov libcmocka-dev gfortran graphviz doxygen>=1.9.2 libzmq3-dev libgomp1 mpich  # libcurl-dev
          sudo apt upgrade --fix-missing
          valgrind --version
      - name: Install dependencies on Mac
        if: matrix.os == 'macos-latest' && matrix.python-install == 'pip'
        run: |
          # brew link --overwrite python@3.11
          brew install cmocka lcov gnutls graphviz doxygen>=1.9.2 curl zeromq libomp open-mpi # llvm
          # Required for compiling with clang & gfortran on GHA
          echo "FC13=$(which gfortran-13)"
          echo "FC14=$(which gfortran-14)"
          echo "FC15=$(which gfortran-15)"
          echo "FC=$(which gfortran-13)" >> "$GITHUB_ENV"
      # - name: Set vcpkg triplet on Windows (mingw)
      #   if: matrix.os == 'windows-2022' && matrix.windows-compiler == 'mingw'
      #   shell: bash -l {0}
      #   run: |
      #     # echo "VCPKG_TRIPLET=x64-mingw" >> "$GITHUB_ENV"
      #     echo "VCPKG_TRIPLET=x64-mingw-static" >> "$GITHUB_ENV"
      - name: Set vcpkg triplet on Windows (msvc)
        if: matrix.os == 'windows-2022' # && matrix.windows-compiler == 'msvc'
        shell: bash -l {0}
        run: |
          echo "VCPKG_TRIPLET=x64-windows" >> "$GITHUB_ENV"
          # echo "VCPKG_TRIPLET=x64-windows-static" >> "$GITHUB_ENV"
      - name: Install dependencies on Windows
        if: matrix.os == 'windows-2022' && matrix.python-install == 'pip'
        run: |
          vcpkg.exe install cmocka --triplet $env:VCPKG_TRIPLET
          vcpkg.exe install curl --triplet $env:VCPKG_TRIPLET
          vcpkg.exe install zeromq --triplet $env:VCPKG_TRIPLET
          # vcpkg.exe install msmpi --triplet $env:VCPKG_TRIPLET
      # - name: Set flags for dependencies on Windows
      #   if: matrix.os == 'windows-2022' && matrix.python-install == 'pip' && matrix.windows-compiler == 'mingw'
      #   shell: bash -l {0}
      #   run: |
      #     echo "CC=gcc.exe" >> "$GITHUB_ENV"
      #     echo "CXX=c++.exe" >> "$GITHUB_ENV"
      # - name: Set flags for dependencies on Windows
      #   if: matrix.os == 'windows-2022' # && matrix.python-install == 'pip'
      #   shell: bash -l {0}
      #   run: |
      #     echo "FC=gfortran.exe" >> "$GITHUB_ENV"

      # RabbitMQ dependencies (don't use the conda package)
      - name: Install RabbitMQ (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y rabbitmq-server librabbitmq-dev
          sudo systemctl start rabbitmq-server
      - name: Install RabbitMQ (Mac)
        if: matrix.os == 'macos-latest'
        run: |
          brew install rabbitmq rabbitmq-c
          brew services start rabbitmq
      - name: Install RabbitMQ (Windows)
        if: matrix.os == 'windows-2022'
        run: |
          choco install rabbitmq
          vcpkg.exe install librabbitmq --triplet $env:VCPKG_TRIPLET

      - name: Setup Python
        if: matrix.python-install == 'pip'
        id: pysetup
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHONVERSION }}
      - name: Fix Python path on mac
        if: matrix.os == 'macos-latest' && matrix.python-install == 'pip'
        run: |
          tee -a ~/.profile <<<'export PATH="${pythonLocation}/bin:${PATH}"'
          echo "PYTHON=${pythonLocation}/bin/python" >> "$GITHUB_ENV"
      - name: Install Python dependencies (PIP)
        if: matrix.python-install == 'pip'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-test.txt

      ###################################
      # CONDA SETUP
      ###################################
      - name: Set up MSVC Compiler on windows
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-2022'
      - name: Set up miniconda test environment
        if: matrix.python-install == 'conda'
        uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: yggcpp
          environment-file: environment.yml
          auto-update-conda: true
          python-version: ${{ env.PYTHONVERSION }}
          channels: conda-forge
          channel-priority: strict
          conda-remove-defaults: "true"
          miniforge-version: latest
      - name: Install LLVM on mac for OpenMP
        if: matrix.os == 'macos-latest' && matrix.python-install == 'conda'
        # shell: bash -l {0}
        run: |
          conda install llvm -y
      - name: Install compilers using conda on Linux/Mac
        if: matrix.os != 'windows-2022' && matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          conda install c-compiler cxx-compiler fortran-compiler
      - name: Install compilers using conda on Windows for MSVC
        if: matrix.os == 'windows-2022' && matrix.python-install == 'conda' && matrix.windows-compiler == 'msvc'
        shell: bash -l {0}
        run: |
          conda install c-compiler cxx-compiler
      - name: Install MinGW on windows for Fortran
        if: matrix.os == 'windows-2022' && matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          conda install gcc gxx gfortran "binutils<2.45" libpython -y
      # - name: Install MinGW on windows for Fortran (mingw)
      #   if: matrix.os == 'windows-2022' && matrix.python-install == 'conda' && matrix.windows-compiler == 'mingw'
      #   shell: bash -l {0}
      #   run: |
      #     conda install gcc gxx gfortran binutils m2w64-sysroot_win-64 libpython -y
      # - name: Install MinGW on windows for Fortran (msvc)
      #   if: matrix.os == 'windows-2022' && matrix.python-install == 'conda' && matrix.windows-compiler == 'msvc'
      #   shell: bash -l {0}
      #   run: |
      #     conda install gcc gxx gfortran binutils libpython -y
      #     # conda install m2w64-gcc-fortran libpython binutils -y
      - name: Install ZeroMQ (conda)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          conda install zeromq -y
      # - name: Install RabbitMQ (conda)
      #   if: matrix.python-install == 'conda'
      #   shell: bash -l {0}
      #   run: |
      #     conda install librabbitmq -y

      ###################################
      # GENERIC SETUP
      ###################################
      - name: Explicitly set MSVC compiler
        if: matrix.os == 'windows-2022' && matrix.windows-compiler == 'msvc'
        shell: bash -l {0}
        run: |
          echo "CC=cl" >> "$GITHUB_ENV"
          echo "CXX=cl" >> "$GITHUB_ENV"
      - name: Extract objconv
        if: matrix.os == 'windows-2022' && matrix.windows-compiler == 'msvc'
        shell: pwsh
        run: |
          Expand-Archive -Path utils\objconv.zip -DestinationPath .\ -Verbose
          Get-ChildItem -Path .\

      ###################################
      # CMAKE ENV VARIABLES
      ###################################
      - name: Set CMAKE_INSTALL_PREFIX for local install
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          echo "CMAKE_INSTALL_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"
      - name: Set CMAKE_INSTALL_PREFIX for local install
        if: matrix.python-install == 'pip' && matrix.os != 'windows-2022'
        shell: bash -l {0}
        run: |
          mkdir ../_install
          echo "CMAKE_INSTALL_PREFIX=$(pwd)/../_install" >> "$GITHUB_ENV"
          # echo "CMAKE_INSTALL_PREFIX=${{ github.workspace }}/../_install" >> "$GITHUB_ENV"
      - name: Set CMAKE_INSTALL_PREFIX for local install
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          mkdir ../_install
          echo "CMAKE_INSTALL_PREFIX=${{ github.workspace }}\\..\\_install" >> "$GITHUB_ENV"
      - name: Install YggdrasilRapidJSON from source
        if: matrix.python-install == 'pip'
        shell: bash -l {0}
        run: |
          echo "PYTHON=${PYTHON}"
          # ./build_yggdrasil_rapidjson.sh --install-dir ${{ env.CMAKE_INSTALL_PREFIX }}
          ./build_yggdrasil_rapidjson.sh --install-dir $(pwd)/../_install
      - name: Set CMAKE_PREFIX_PATH for local install (Unix)
        if: matrix.python-install == 'pip' && matrix.os != 'windows-2022'
        shell: bash -l {0}
        run: |
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
          echo "CMAKE_PREFIX_PATH=${{ env.CMAKE_INSTALL_PREFIX }}" >> "$GITHUB_ENV"
          echo "PYTHON_CONFIG_FLAGS=${{ env.PYTHON_CONFIG_FLAGS }} --config-settings=cmake.define.CMAKE_PREFIX_PATH=${{ env.CMAKE_INSTALL_PREFIX }}" >> "$GITHUB_ENV"
      # If any variables added to PYTHON_CONFIG_FLAGS, need to handle escaping quotes
      - name: Set CMAKE_PREFIX_PATH for local install (Windows)
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          echo "CMAKE_PREFIX_PATH=${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET};${{ env.CMAKE_INSTALL_PREFIX }}" >> "$GITHUB_ENV"
          echo "PYTHON_CONFIG_FLAGS=${{ env.PYTHON_CONFIG_FLAGS }} --config-settings=cmake.define.Python3_ROOT_DIR=${{ env.pythonLocation }} --config-settings=cmake.define.CMAKE_PREFIX_PATH=\"${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET};${{ env.CMAKE_INSTALL_PREFIX }}\"" >> "$GITHUB_ENV"
          

      ###################################
      # SET CONFIG FLAGS
      ###################################
      - name: Global config flags
        shell: bash -l {0}
        run: |
          CMAKE_BUILD_TYPE_TEST="Debug"
          echo "CMAKE_BUILD_TYPE_TEST=Debug" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS_BASE=-G Ninja -DCMAKE_VERBOSE_MAKEFILE:BOOL=ON -DCMAKE_MESSAGE_LOG_LEVEL:STRING=DEBUG" >> "$GITHUB_ENV"
          # echo "CMAKE_ARGS_NO_PYTHON=-DYGG_Fortran_REQUIRED=ON" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS_NO_PYTHON=-DBUILD_Fortran_LIBRARY=OFF" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS_TEST=-DYGG_BUILD_CXX_TESTS=ON -DYGG_BUILD_Fortran_TESTS=OFF -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE_TEST} -DYGG_DEBUG_LEVEL=5" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS_PYTHON=-DYGG_DEBUG_LEVEL=5" >> "$GITHUB_ENV"
          echo "TEST_FLAGS=-C ${CMAKE_BUILD_TYPE_TEST} --output-on-failure -VV" >> "$GITHUB_ENV"

      - name: Prevent parallel build on windows to avoid dlltool error
        if: matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_BASE=${{ env.CMAKE_ARGS_BASE }} -DCMAKE_BUILD_PARALLEL_LEVEL=1 -DYGG_INSPECT_TARGETS_ONLY_MISSING:BOOL=ON" >> "$GITHUB_ENV"
          
      # Set flags so there is an error if a dependency isn't found
      - name: Temporary flags to disable optional features on windows
        if: matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_TEST=${{ env.CMAKE_ARGS_TEST }} -DENABLE_MPI=OFF -DENABLE_RMQ=OFF -DENABLE_REST=OFF -DENABLE_OMP=OFF" >> "$GITHUB_ENV"
      - name: Set flags so there is an error if an optional dependency isn't found
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_TEST=${{ env.CMAKE_ARGS_TEST }} -DREQUIRE_ZMQ=ON -DREQUIRE_MPI=ON -DREQUIRE_RMQ=ON -DREQUIRE_THREADS=ON" >> "$GITHUB_ENV"
      - name: IPC config flags
        if: matrix.os != 'windows-2022'
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_TEST=${{ env.CMAKE_ARGS_TEST }} -DREQUIRE_IPC=ON" >> "$GITHUB_ENV"
      - name: Conda specific optional dependency requirements
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_TEST=${{ env.CMAKE_ARGS_TEST }} -DREQUIRE_REST=ON -DREQUIRE_OMP=ON" >> "$GITHUB_ENV"
          
      - name: Disable debugging config flags (e.g. ELF, valgrind, ASAN)
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_TEST=${{ env.CMAKE_ARGS_TEST }} -DYGG_ENABLE_ELF=OFF -DYGG_SKIP_VALGRIND_TESTS=ON" >> "$GITHUB_ENV"

      # - name: Pip config flags on Unix & install YggdrasilRapidJSON from source
      #   if: matrix.python-install == 'pip' && matrix.os != 'windows-2022'
      #   shell: bash -l {0}
      #   run: |
      #     echo "CMAKE_ARGS_NO_PYTHON=${{ env.CMAKE_ARGS_NO_PYTHON }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/../_install" >> "$GITHUB_ENV"
      #     echo "PYTHON_CONFIG_FLAGS=${{ env.PYTHON_CONFIG_FLAGS }} --config-settings=cmake.define.CMAKE_PREFIX_PATH=${{ github.workspace }}/../_install" >> "$GITHUB_ENV"

      ############################################
      # SET CONFIG FLAGS THAT CONTAIN QUOTES LAST
      ############################################
      - name: Pip config flags
        if: matrix.python-install == 'pip'
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS_BASE=${{ env.CMAKE_ARGS_BASE }} \"-DPython3_ROOT_DIR=${{ env.pythonLocation }}\"" >> "$GITHUB_ENV"
      # - name: Pip config flags on Windows & install YggdrasilRapidJSON from source
      #   if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
      #   shell: bash -l {0}
      #   run: |
      #     # echo "CMAKE_ARGS_NO_PYTHON=${{ env.CMAKE_ARGS_NO_PYTHON }} \"-DCMAKE_INSTALL_PREFIX=${{ github.workspace }}\\_install\" \"-DCMAKE_PREFIX_PATH=${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET};${{ github.workspace }}\\..\\_install\"" >> "$GITHUB_ENV"
      #     # echo "PYTHON_CONFIG_FLAGS=${{ env.PYTHON_CONFIG_FLAGS }} --config-settings=cmake.define.Python3_ROOT_DIR=${{ env.pythonLocation }} --config-settings=cmake.define.CMAKE_PREFIX_PATH=\"${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET};${{ github.workspace }}\\..\\_install\"" >> "$GITHUB_ENV"
     
      ###################################
      # Add paths for Windows dlls
      ###################################
      - name: Mingw library paths on Windows (Powershell)
        if: matrix.os == 'windows-2022' && matrix.python-install == 'pip' # && matrix.windows-compiler == 'mingw'
        run: |
          # This isn't necessary, but it speeds up the build
          echo "C:\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Mingw library paths on Windows (Bash)
        if: matrix.os == 'windows-2022' && matrix.python-install == 'pip'
        shell: bash -l {0}
        run: |
          MINGW_BIN_DIRECTORY="C:\mingw64\bin"
          echo "ls MINGW_BIN_DIRECTORY = ${MINGW_BIN_DIRECTORY}"
          ls ${MINGW_BIN_DIRECTORY}
          echo "MINGW_BIN_DIRECTORY=${MINGW_BIN_DIRECTORY}" >> "$GITHUB_ENV"
          echo "MINGW_PTHREAD_ROOT=${MINGW_BIN_DIRECTORY}" >>  "$GITHUB_ENV"
          # This isn't necessary, but it speeds up the build
          echo "${MINGW_BIN_DIRECTORY}" >> $GITHUB_PATH
      - name: Check dependencies of dlltool (MINGW)
        if: matrix.os == 'windows-2022' && matrix.python-install == 'pip'
        shell: bash -l {0}
        run: |
          python cmake/scripts/inspect_runtime_dependencies.py --recurse --verbose dlltool
      - name: Vcpkg library paths on Windows (Powershell)
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        run: |
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET\debug\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "$env:VCPKG_INSTALLATION_ROOT\installed\$env:VCPKG_TRIPLET\debug\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Vcpkg library paths on Windows (Bash)
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          DLL_DIRECTORY="${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET}\bin"
          echo "ls DLL_DIRECTORY = ${DLL_DIRECTORY}"
          ls ${DLL_DIRECTORY}
          echo "${DLL_DIRECTORY}" >> $GITHUB_PATH
          LIB_DIRECTORY="${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET}\lib"
          echo "ls LIB_DIRECTORY = ${LIB_DIRECTORY}"
          ls ${LIB_DIRECTORY}
          echo "${LIB_DIRECTORY}" >> $GITHUB_PATH
          DLL_DIRECTORY_D="${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET}\debug\bin"
          echo "ls DLL_DIRECTORY_D = ${DLL_DIRECTORY_D}"
          ls ${DLL_DIRECTORY_D}
          echo "${DLL_DIRECTORY_D}" >> $GITHUB_PATH
          LIB_DIRECTORY_D="${VCPKG_INSTALLATION_ROOT}\installed\\${VCPKG_TRIPLET}\debug\lib"
          echo "ls LIB_DIRECTORY_D = ${LIB_DIRECTORY_D}"
          ls ${LIB_DIRECTORY_D}
          echo "${LIB_DIRECTORY_D}" >> $GITHUB_PATH
      - name: Conda library paths on Windows
        if: matrix.python-install == 'conda' && matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          # Versions nested in Library
          LIB_DIRECTORY="${CONDA_PREFIX}/Library/lib"
          echo "ls LIB_DIRECTORY = ${LIB_DIRECTORY}"
          ls ${LIB_DIRECTORY}
          echo "${LIB_DIRECTORY}" >> $GITHUB_PATH
          DLL_DIRECTORY="${CONDA_PREFIX}/Library/bin"
          echo "ls DLL_DIRECTORY = ${DLL_DIRECTORY}"
          ls ${DLL_DIRECTORY}
          echo "${DLL_DIRECTORY}" >> $GITHUB_PATH
          # Un-nested versions (seems to be the case for current conda)
          LIB_DIRECTORY="${CONDA_PREFIX}/lib"
          echo "ls LIB_DIRECTORY = ${LIB_DIRECTORY}"
          ls ${LIB_DIRECTORY}
          echo "${LIB_DIRECTORY}" >> $GITHUB_PATH
      # - name: Conda library paths on Windows (mingw)
      #   if: matrix.python-install == 'conda' && matrix.os == 'windows-2022' && matrix.windows-compiler == 'mingw'
      #   shell: bash -l {0}
      #   run: |
      #     LIBRARY_DIRECTORY="${CONDA_PREFIX}/Library"
      #     echo "ls LIBRARY_DIRECTORY = ${LIBRARY_DIRECTORY}"
      #     ls ${LIBRARY_DIRECTORY}
      #     MINGW_DIRECOTRY="${CONDA_PREFIX}/Library/mingw-w64"
      #     echo "ls MINGW_DIRECOTRY = ${MINGW_DIRECOTRY}"
      #     ls ${MINGW_DIRECOTRY}
      #     # MINGW_DIRECTORY_INC="${CONDA_PREFIX}/Library/mingw-w64/include"
      #     # MINGW_DIRECTORY_BIN="${CONDA_PREFIX}/Library/mingw-w64/bin"
      #     # MINGW_DIRECTORY_LIB="${CONDA_PREFIX}/Library/mingw-w64/lib"
      #     MIN_DIRECTORY="${CONDA_PREFIX}/Library/mingw-w64/x86_64-w64-mingw32"
      #     echo "ls MIN_DIRECTORY = ${MIN_DIRECTORY}"
      #     ls ${MIN_DIRECTORY}
      #     # MININC_DIRECTORY="${CONDA_PREFIX}/Library/mingw-w64/x86_64-w64-mingw32/include"
      #     # echo "ls MININC_DIRECTORY=${MININC_DIRECTORY}"
      #     # ls ${MININC_DIRECTORY}
      #     # MINLIB_DIRECTORY="${CONDA_PREFIX}/Library/mingw-w64/x86_64-w64-mingw32/lib"
      #     # echo "ls MINLIB_DIRECTORY=${MINLIB_DIRECTORY}"
      #     # ls ${MINLIB_DIRECTORY}
      #     # MINBIN_DIRECTORY="${CONDA_PREFIX}/Library/mingw-w64/x86_64-w64-mingw32/bin"
      #     # echo "ls MINBIN_DIRECTORY=${MINBIN_DIRECTORY}"
      #     # ls ${MINBIN_DIRECTORY}
      #     echo "MINGW_PTHREAD_ROOT=${MIN_DIRECTORY}" >> "$GITHUB_ENV"
      - name: Set CMAKE_GENERATOR for MinGW
        if: matrix.os == 'windows-2022' && matrix.windows-compiler == 'mingw'
        shell: bash -l {0}
        run: |
          echo "CMAKE_GENERATOR=MinGW Makefiles" >> $GITHUB_ENV
      
      ###################################
      # Check
      ###################################
      - name: Check installed packages (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          conda list
          python -c "import sys; print(sys.executable)"
          python -c "import numpy; print(numpy.get_include())"
      - name: Check installed packages (PIP)
        if: matrix.python-install == 'pip'
        run: |
          pip list
          python -c "import sys; print(sys.executable)"
          python -c "import numpy; print(numpy.get_include())"

      ###################################
      # Configure
      ###################################
      - name: Remove Strawberry Perl from PATH
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        run: |
          $env:PATH = $env:PATH -replace "C:\\Strawberry\\c\\bin;", ""
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem -Path C:\Strawberry -Recurse | Remove-Item -force -recurse
          Remove-Item C:\Strawberry -Force
      - name: Remove Java_Temurin-Hotspot_jdk from PATH
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        run: |
          $env:PATH = $env:PATH -replace "C:\\hostedtoolcache\\windows\\Java_Temurin-Hotspot_jdk\\17.0.19-10\\x64\\bin;", ""
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem -Path C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk -Recurse | Remove-Item -force -recurse
          Remove-Item C:\hostedtoolcache\windows\Java_Temurin-Hotspot_jdk -Force
      - name: Check cmake (PIP)
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        run: |
          where.exe cmake | Write-Output
          where.exe ctest | Write-Output
      - name: Configure (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          mkdir build
          cd build
          which cmake
          cmake .. ${{ env.CMAKE_ARGS_BASE }} ${{ env.CMAKE_ARGS_NO_PYTHON }} ${{ env.CMAKE_ARGS_TEST }}
      - name: Configure (PIP)
        if: matrix.python-install == 'pip'
        run: |
          mkdir build
          cd build
          cmake .. ${{ env.CMAKE_ARGS_BASE }} ${{ env.CMAKE_ARGS_NO_PYTHON }} ${{ env.CMAKE_ARGS_TEST }} "-DCMAKE_PREFIX_PATH=${{ env.CMAKE_PREFIX_PATH }}"
      
      ###################################
      # Build CXX, C & Fortran
      ###################################
      - name: Build C++, C, & Fortran Interfaces (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          cd build
          cmake --build . --config ${{ env.CMAKE_BUILD_TYPE_TEST }}
      - name: Build C++, C, & Fortran Interfaces (PIP)
        if: matrix.python-install == 'pip'
        run: |
          cd build
          cmake --build . --config ${{ env.CMAKE_BUILD_TYPE_TEST }}
      
      ###################################
      # Test CXX, C, & Fortran
      ###################################
      - name: Test C++, C, & Fortran Interfaces (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          conda list
          echo "PATH=$PATH"
          cd build
          which ctest
          ctest ${{ env.TEST_FLAGS }}
      - name: Show path (PIP & WINDOWS)
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        run: |
          echo $env:path
      - name: Test C++, C, & Fortran Interfaces (PIP)
        if: matrix.python-install == 'pip'
        run: |
          echo "PATH=$env:PATH"
          cd build
          ctest ${{ env.TEST_FLAGS }}

      ###################################
      # Build Python
      ###################################
      - name: Set CMAKE_ARGS for Python build
        shell: bash -l {0}
        run: |
          echo "OLD_CMAKE_ARGS=${{ env.CMAKE_ARGS }}" >> "$GITHUB_ENV"
          echo "CMAKE_ARGS=${{ env.CMAKE_ARGS_BASE }} ${{ env.CMAKE_ARGS_PYTHON }}" >> "$GITHUB_ENV"
      - name: Build Python (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          python -m pip install . -v ${{ env.PYTHON_CONFIG_FLAGS }}
      - name: Build Python (PIP)
        if: matrix.python-install == 'pip'
        run: |
          python -m pip install . -v ${{ env.PYTHON_CONFIG_FLAGS }}
      - name: Unset CMAKE_ARGS for Python build
        shell: bash -l {0}
        run: |
          echo "CMAKE_ARGS=${{ env.OLD_CMAKE_ARGS }}" >> "$GITHUB_ENV"

      ###################################
      # Test Python
      ###################################
      - name: Test Python Interfaces (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          pytest -sv tests/python
      # - name: Check for Python Interfaces (PIP)
      #   if: matrix.python-install == 'pip'
      #   shell: bash -l {0}
      #   run: |
      #     PYTHON_EXEC=${{ steps.pysetup.outputs.python-path }}
      #     ${PYTHON_EXEC} -m site
      #     ${PYTHON_EXEC} -c 'import site; print(site.getsitepackages())'
      #     ls $(${PYTHON_EXEC} -c 'import site; print(site.getsitepackages()[0])')
      #     ls $(${PYTHON_EXEC} -c 'import os; import site; print(os.path.join(site.getsitepackages()[0], "pyYggdrasil"))')
      # - name: Test Python Interfaces w/ LLDB (PIP)
      #   if: matrix.python-install == 'pip' && matrix.os == 'macos-latest'
      #   run: |
      #     lldb -o 'run' -o 'quit' -- $(which python) -m pytest -svx tests/python
      # - name: Test Python Interfaces w/ GDB (PIP)
      #   if: matrix.python-install == 'pip' && matrix.os == 'ubuntu-latest'
      #   run: |
      #     gdb --batch -x gdb_commands.txt --args $(which python) -m pytest -svx tests/python
      - name: Test Python Interfaces (PIP)
        if: matrix.python-install == 'pip'
        run: |
          pytest -sv tests/python

      ###################################
      # Install CXX, C & Fortran interfaces
      ###################################
      - name: Install C++, C, & Fortran (CONDA)
        if: matrix.python-install == 'conda'
        shell: bash -l {0}
        run: |
          cd build
          cmake --install .
          # ctest --output-on-failure -VV
      - name: Install C++, C, & Fortran (PIP)
        if: matrix.python-install == 'pip'
        run: |
          cd build
          cmake --install .
      
      ###################################
      # Speed tests
      ###################################
      - name: Add install directory to path on Windows
        if: matrix.python-install == 'pip' && matrix.os == 'windows-2022'
        shell: bash -l {0}
        run: |
          echo "${CMAKE_INSTALL_PREFIX}\\bin" >> $GITHUB_PATH
      - name: Configure speed tests (CONDA)
        if: matrix.python-install != 'pip'
        shell: bash -l {0}
        run: |
          mkdir build_speed
          cmake -G Ninja -B build_speed -S tests/speedtest -DCOMM=ALL -DENABLE_Fortran=OFF
      - name: Configure speed tests (PIP)
        if: matrix.python-install == 'pip'
        shell: bash -l {0}
        run: |
          echo "CMAKE_INSTALL_PREFIX=${CMAKE_INSTALL_PREFIX}"
          echo "CMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}"
          echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
          mkdir build_speed
          cmake -G Ninja -B build_speed -S tests/speedtest -DCOMM=ALL "-DCMAKE_PREFIX_PATH=${CMAKE_PREFIX_PATH}" -DENABLE_Fortran=OFF
      - name: Run speed tests
        shell: bash -l {0}
        run: |
          cmake --build build_speed --config Release
          ctest --test-dir build_speed --output-on-failure -VV -C Release

  test:
    name: Run tests on ${{ matrix.os }} for Python ${{ matrix.python-version }} (environment ${{ matrix.pixi-environment }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        pixi-environment: [py311, py315-core]
        include:
          - pixi-environment: py311
            python-version: "3.11"
          - pixi-environment: py315-core
            python-version: "3.15"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
      - name: Set up MSVC Compiler on windows
        uses: ilammy/msvc-dev-cmd@v1
        if: matrix.os == 'windows-latest'
        with:
          # toolset: "14.3"  # vs2022 set in conda-forge-pinnings
          toolset: "14.5"  # vs2026 set in conda-forge-pinnings
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: test-${{ matrix.pixi-environment }}
          activate-environment: test-${{ matrix.pixi-environment }}
      - name: Run tests
        run: pixi run -e test-${{ matrix.pixi-environment }} all-tests -- --output-on-failure --verbose

  test-coverage:
    name: Run tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: coverage
          activate-environment: coverage
      - name: Run tests
        run: pixi run -e coverage test-coverage -- --output-on-failure --verbose
      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          name: ubuntu-latest-default
          token: ${{ secrets.CODECOV_TOKEN }}
          file: build/coverage/coverage.info
          functionalities: gcov

  test-elf:
    name: Run tests with ELF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: elf
          activate-environment: elf
      - name: Run tests
        run: pixi run -e elf test-elf -- --output-on-failure --verbose

  test-asan:
    name: Run tests with ASAN & UBSAN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: asan
          activate-environment: asan
      - name: Run tests
        run: pixi run -e asan test-asan -- --output-on-failure --verbose

  test-valgrind:
    name: Run tests with valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: valgrind
          activate-environment: valgrind
      - name: Run tests
        run: pixi run -e valgrind test-valgrind -- --output-on-failure --verbose

  docs:
    name: Build the docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-tags: true
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
      - name: Build docs
        run: pixi run -e docs docs

  all_tests_passed:
    runs-on: ubuntu-latest
    name: All tests passed
    needs: [build_cxx, test, test-coverage, test-elf, test-asan, test-valgrind, docs]
    if: always()
    steps:
      - name: All tests ok
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: exit 0
      - name: Some tests failed
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1
